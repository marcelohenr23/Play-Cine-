<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Cine - Neon Edition</title>
    <link rel="stylesheet" href="style.css?v=4.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="introSplash" class="splash-screen">
        <div class="neon-logo-box">
            <span class="neon-play">PLAY</span><span class="neon-cine">CINE</span>
        </div>
    </div>

    <section id="mainAppSection" class="view-section active">
        <header class="navbar">
            <div class="header-brand" style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                <h1 class="brand-header" style="margin-bottom:0; font-size:1.8rem;">
                    <span class="neon-play">PLAY</span><span class="neon-cine">CINE</span>
                </h1>
                <button id="menuBtn" style="background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 5px;">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </header>

        <div class="content-container">
            <div class="search-bar-container neon-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Pesquisar filme ou gênero...">
            </div>

            <div class="filter-bar">
                <button class="filter-btn active" data-category="all">Todos</button>
                <button class="filter-btn" data-category="Ação">Ação</button>
                <button class="filter-btn" data-category="Terror">Terror</button>
                <button class="filter-btn" data-category="Ficção">Ficção</button>
                <button class="filter-btn" data-category="Aventura">Aventura</button>
                <button class="filter-btn" data-category="Comédia">Comédia</button>
            </div>

            <section class="catalog-section">
                <h3>Lançamentos Recentes</h3>
                <div id="recentMovieGrid" class="movie-grid" style="margin-bottom: 25px;"></div>

                <h3>Filmes</h3>
                <div id="movieGrid" class="movie-grid" style="margin-bottom: 25px;"></div>

                <h3>Séries</h3>
                <div id="serieGrid" class="movie-grid" style="margin-bottom: 25px;"></div>

                <h3>Tops Séries</h3>
                <div id="topSerieGrid" class="movie-grid" style="margin-bottom: 25px;"></div>

                <h3 id="Conteúdo Premium">Conteúdo Premium</h3>
                <div id="premiumGrid" class="movie-grid"></div>
            </section>
        </div>
    </section>

    <footer style="text-align: center; padding: 20px; color: var(--text-muted);">
        <p>&copy; 2026 Play Cine. Todos os direitos reservados.</p>
    </footer>
            
    <div id="videoModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:1000; flex-direction:column; overflow-y:auto;">
    <!-- Botão Fechar -->
    <button id="closeVideoModal" style="position:absolute; top:20px; right:20px; z-index:10; background:none; border:none; color:white; font-size:24px; cursor:pointer;">✕</button>

    <!-- 1. Tela de Detalhes (Estilo Netflix) -->
    <div id="modalDetailsContainer" style="width:100%; max-width:600px; margin:auto; padding:20px; color:white;">
        <img id="modalBackdrop" src="" alt="Capa" style="width:100%; height:300px; object-fit:cover; border-radius:8px;">
        <h2 id="modalMovieTitle" style="margin-top:15px; font-size:1.8rem;"></h2>
        <p id="modalMetadata" style="color:#aaa; font-size:0.9rem; margin:5px 0;"></p>
        
        <!-- Botão Assistir (Usado para filmes ou play geral) -->
        <button id="playButton" style="width:100%; background:white; color:black; border:none; padding:12px; border-radius:4px; font-weight:bold; font-size:1rem; margin:15px 0; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;">
            <i class="fa-solid fa-play"></i> Assistir
        </button>

        <p id="modalMovieDesc" style="font-size:0.95rem; line-height:1.4; color:#ddd; margin-bottom: 20px;"></p>

        <!-- SEÇÃO DE EPISÓDIOS (Aparece apenas para Séries) -->
        <div id="serieEpisodesSection" style="display:none; border-top: 1px solid #333; padding-top: 15px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="font-size: 1.2rem; margin: 0;">Episódios</h3>
                <select id="seasonSelect" style="background: #222; color: white; border: 1px solid #441; padding: 6px 12px; border-radius: 4px; font-size: 0.9rem; outline: none;">
                    <option value="1">Temporada 1</option>
                </select>
            </div>
            <!-- Lista de Episódios gerada dinamicamente -->
            <div id="episodesList" style="display: flex; flex-direction: column; gap: 12px;"></div>
        </div>
    </div>

    <!-- 2. Container do Player -->
    <div id="playerContainer" style="display:none; width:100%; height:100%; margin:auto;">
        <iframe id="moviePlayer" src="" style="width:100%; height:100%; border:none;" allowfullscreen></iframe>
    </div>
    </div>

    <script src="script.js?v=6.0"></script>
</body>
</html>
