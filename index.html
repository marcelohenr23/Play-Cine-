<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Cine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #0f1014; color: white; margin: 0; font-family: sans-serif;">

    <!-- Splash Screen Inicial -->
    <div id="introSplash" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#0f1014; display:flex; align-items:center; justify-content:center; z-index:9999; transition: opacity 0.5s ease;">
        <h1 style="color: #ff0055; font-size: 2.5rem; letter-spacing: 2px;">PLAY CINE</h1>
    </div>

    <!-- Cabeçalho -->
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(15,16,20,0.9); position: sticky; top: 0; z-index: 100;">
        <h1 style="color: #ff0055; font-size: 1.5rem; margin: 0;">PLAYCINE</h1>
        <button id="menuBtn" style="background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer;"><i class="fa-solid fa-bars"></i></button>
    </header>

    <!-- Barra de Pesquisa -->
    <div style="padding: 15px 20px;">
        <div style="background: #1a1b22; display: flex; align-items: center; padding: 10px 15px; border-radius: 8px; border: 1px solid #2a2b36;">
            <i class="fa-solid fa-magnifying-glass" style="color: #888; margin-right: 10px;"></i>
            <input type="text" id="searchInput" placeholder="Pesquisar filme ou gênero..." style="background: none; border: none; color: white; width: 100%; outline: none; font-size: 0.95rem;">
        </div>
    </div>

    <!-- Filtros por Categoria -->
    <div style="display: flex; gap: 10px; overflow-x: auto; padding: 0 20px 15px 20px; scrollbar-width: none;">
        <button class="filter-btn active" data-category="all" style="background: #007bff; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-weight: bold;">Todos</button>
        <button class="filter-btn" data-category="Ação" style="background: #1a1b22; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap;">Ação</button>
        <button class="filter-btn" data-category="Terror" style="background: #1a1b22; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap;">Terror</button>
        <button class="filter-btn" data-category="Ficção" style="background: #1a1b22; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap;">Ficção</button>
        <button class="filter-btn" data-category="Aventura" style="background: #1a1b22; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap;">Aventura</button>
    </div>

    <!-- Conteúdo Principal / Seções -->
    <main style="padding: 0 20px 40px 20px;">
        <section style="margin-bottom: 25px;">
            <h3 style="font-size: 1.1rem; margin-bottom: 10px; color: #fff;">Lançamentos Recentes</h3>
            <div id="recentMovieGrid"></div>
        </section>

        <section style="margin-bottom: 25px;">
            <h3 style="font-size: 1.1rem; margin-bottom: 10px; color: #fff;">Filmes</h3>
            <div id="movieGrid"></div>
        </section>

        <section style="margin-bottom: 25px;">
            <h3 style="font-size: 1.1rem; margin-bottom: 10px; color: #fff;">Séries</h3>
            <div id="serieGrid"></div>
        </section>

        <section style="margin-bottom: 25px;">
            <h3 style="font-size: 1.1rem; margin-bottom: 10px; color: #fff;">Tops Séries</h3>
            <div id="topSerieGrid"></div>
        </section>

        <section style="margin-bottom: 25px;">
            <h3 style="font-size: 1.1rem; margin-bottom: 10px; color: #fff;">Conteúdo Premium</h3>
            <div id="premiumGrid"></div>
        </section>
    </main>

    <!-- Modal de Vídeo / Detalhes -->
    <div id="videoModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:1000; flex-direction:column; overflow-y:auto;">
        <button id="closeVideoModal" style="position:absolute; top:20px; right:20px; z-index:10; background:none; border:none; color:white; font-size:24px; cursor:pointer;">✕</button>

        <div id="modalDetailsContainer" style="width:100%; max-width:600px; margin:auto; padding:20px; color:white; box-sizing: border-box;">
            <img id="modalBackdrop" src="" alt="Capa" style="width:100%; height:250px; object-fit:cover; border-radius:8px;">
            <h2 id="modalMovieTitle" style="margin-top:15px; font-size:1.6rem;"></h2>
            <p id="modalMetadata" style="color:#aaa; font-size:0.9rem; margin:5px 0;"></p>
            
            <button id="playButton" style="width:100%; background:white; color:black; border:none; padding:12px; border-radius:4px; font-weight:bold; font-size:1rem; margin:15px 0; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;">
                <i class="fa-solid fa-play"></i> Assistir
            </button>

            <p id="modalMovieDesc" style="font-size:0.95rem; line-height:1.4; color:#ddd; margin-bottom: 20px;"></p>
        </div>

        <div id="playerContainer" style="display:none; width:100%; height:100%; margin:auto;">
            <iframe id="moviePlayer" src="" style="width:100%; height:100%; border:none;" allowfullscreen></iframe>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
