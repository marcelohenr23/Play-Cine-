<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Cine - Neon Edition</title>
    <link rel="stylesheet" href="style.css?v=4.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- ANIMAÇÃO DE ENTRADA ESTILO NETFLIX COM NEON -->
    <div id="introSplash" class="splash-screen">
        <div class="neon-logo-box">
            <span class="neon-play">PLAY</span><span class="neon-cine">CINE</span>
        </div>
    </div>

    <!-- Plataforma Principal (Catálogo Direto) -->
    <section id="mainAppSection" class="view-section active">
        <header class="navbar">
            <div class="header-brand" style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                <h1 class="brand-header" style="margin-bottom:0; font-size:1.8rem;">
                    <span class="neon-play">PLAY</span><span class="neon-cine">CINE</span>
                </h1>
                <!-- Botão de Menu (3 traços) adicionado mantendo todo o resto intacto -->
                <button id="menuBtn" style="background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 5px;">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </header>

        <div class="content-container">
            <div class="search-bar-container neon-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Pesquisar filme ou gênero...">
            </div>

            <div class="filter-bar">
                <button class="filter-btn active" data-category="all">Todos</button>
                <button class="filter-btn" data-category="Ação">Ação</button>
                <button class="filter-btn" data-category="Terror">Terror</button>
                <button class="filter-btn" data-category="Ficção">Ficção</button>
                <button class="filter-btn" data-category="Aventura">Aventura</button>
                <button class="filter-btn" data-category="Comédia">Comédia</button>
            </div>

            <section class="catalog-section">
                <h3>Lançamentos Recentes</h3>
                <div id="recentMovieGrid" class="movie-grid" style="margin-bottom: 25px;"></div>

                <h3>Filmes</h3>
                <div id="movieGrid" class="movie-grid" style="margin-bottom: 25px;"></div>

                <h3>Séries</h3>
                <div id="serieGrid" class="movie-grid" style="margin-bottom: 25px;"></div>

                <h3>Tops Séries</h3>
                <div id="topSerieGrid" class="movie-grid" style="margin-bottom: 25px;"></div>

                <h3 id="Conteúdo Premium">Conteúdo Premium</h3>
                <div id="premiumGrid" class="movie-grid"></div>
            </section>
        </div>
    </section>

    <footer style="text-align: center; padding: 20px; color: var(--text-muted);">
        <p>&copy; 2026 Play Cine. Todos os direitos reservados.</p>
    </footer>
            
        <!-- MODAL DE REPRODUÇÃO DO VÍDEO -->
    <div id="videoModal" class="modal" style="display: none; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; padding: 15px;">
        <div class="modal-content video-modal-content" style="background: #121212; width: 100%; max-width: 800px; border-radius: 12px; overflow: hidden; position: relative; box-shadow: 0 8px 25px rgba(0,0,0,0.7); border: 1px solid #222;">
            
            <!-- Barra superior do modal com título e botão de fechar -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid #222;">
                <div>
                    <h3 id="modalMovieTitle" style="font-size: 1.1rem; color: #fff; margin: 0 0 4px 0; font-weight: 600;">Título</h3>
                    <p id="modalMovieDesc" style="color: #888; font-size: 0.8rem; margin: 0;">Gênero • Ano</p>
                </div>
                <button id="closeVideoModal" style="background: #222; border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem;"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Container do Player de Vídeo -->
            <div class="video-container" style="position: relative; width: 100%; aspect-ratio: 16/9; background: #000;">
                <iframe id="moviePlayer" src="" title="Player de Vídeo" style="width: 100%; height: 100%; border: none;" allowfullscreen></iframe>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
